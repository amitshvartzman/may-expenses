name: keep-alive

# Supabase pauses a free project after 7 days without activity.
# This pings the database every day so the app never goes to sleep.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the database
        run: |
          URL=$(sed -n "s/.*supabaseUrl: '\(.*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*supabaseKey: '\(.*\)'.*/\1/p" config.js)
          AUTH=()
          case "$KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}'

      # GitHub turns off scheduled workflows in repositories with no commits for 60 days.
      # One small commit a month keeps this schedule running.
      - name: Monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%MZ > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "Keep-alive heartbeat"
            git push
          fi
